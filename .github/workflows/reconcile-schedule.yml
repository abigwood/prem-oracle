name: Reconcile kickoff schedule

# Schedule-integrity: keep PL/ELC kickoff dates/times accurate against
# football-data.org so players never depend on anyone noticing a TV move.
#
# Scope note: this reconciles ONLY date/time/startAt for upcoming fixtures,
# matched by stable home|away identity, failing closed on anything ambiguous or
# incomplete. It never touches results, IDs, picks or forecasts. Settlement
# still runs in the worker cron; this just keeps the feed (and therefore lock
# times, which derive from it) honest ahead of kick-off.

on:
  schedule:
    # Daily 05:00 UTC — ahead of the day's kickoffs and the Tue/Fri intel refresh.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: reconcile-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reconcile upcoming kickoffs against the provider schedule
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/reconcile_schedule.mjs

      - name: Commit corrected kickoff times if anything verified changed
        run: |
          if git diff --quiet -- data/fixtures.json data/fixtures-elc.json; then
            echo "No verified kickoff changes — nothing to commit."
            exit 0
          fi
          git config user.name "prem-oracle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/fixtures.json data/fixtures-elc.json
          git commit -m "chore(schedule): reconcile verified kickoff changes [skip ci]"
          git push
