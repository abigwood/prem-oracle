name: Refresh forecast intel

# Rolling in-season update of the Prem Oracle forecast model.
#
# Re-runs the intel pipeline with 2026/27 results folded in (last-6 form across
# the season/division boundary + rating blend) and commits data/fixtures.json
# when the forecast actually changes. The build is idempotent, so quiet weeks
# produce no commit. Runs entirely on the GitHub Actions free tier.
#
# Setup: add a repository secret FOOTBALL_DATA_TOKEN (football-data.org free
# tier — same token used by the worker). Without it the run degrades to the
# committed 2025/26 baseline and simply makes no changes.

on:
  schedule:
    # Tuesday & Friday 06:00 UTC — after typical midweek and weekend rounds.
    - cron: "0 6 * * 2,5"
  workflow_dispatch: {}

# Avoid overlapping refreshes.
concurrency:
  group: refresh-intel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild forecast intel (with current-season results)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/build_intel.mjs --refresh

      - name: Commit if the forecast changed
        run: |
          if git diff --quiet -- data/fixtures.json; then
            echo "No forecast change — nothing to commit."
            exit 0
          fi
          git config user.name "prem-oracle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/fixtures.json
          git commit -m "chore(intel): refresh 2026/27 forecast [skip ci]"
          git push
